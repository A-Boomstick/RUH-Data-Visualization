<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RUH Digital Dashboard — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .login-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 24px;
    }

    .login-logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      overflow: hidden;
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-title {
      text-align: center;
    }

    .login-title h2 {
      font-size: 1.6rem;
      font-weight: 900;
      color: white;
      letter-spacing: -0.5px;
    }

    .login-title p {
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 420px;
    }

    .login-card h3 {
      font-size: 1.1rem;
      font-weight: 900;
      color: #111;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #555;
    }

    .login-field input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid #ddd;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.95rem;
      color: #111;
      outline: none;
    }

    .login-field input:focus {
      border-color: #1873bb;
    }

    .login-btn {
      background: #1873bb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.5px;
    }

    .login-btn:hover {
      background: #1565a8;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .login-divider hr {
      flex: 1;
      border: none;
      border-top: 2px solid #e8e8e8;
    }

    .login-divider span {
      font-size: 0.8rem;
      font-weight: 700;
      color: #aaa;
    }

    .forgot-link {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1873bb;
      cursor: pointer;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-footer {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>RUH Digital Dashboard</h1>
    <div class="header-logo">
      <img src="logo.png" alt="RUH Logo" />
    </div>
  </div>

  <div class="login-wrapper">

    <div class="login-title">
      <h2>Welcome Back</h2>
      <p>Sign in to your NHS account</p>
    </div>

    <div class="login-card">
      <h3>Sign In</h3>

      <div class="login-field">
        <label>Email</label>
        <input type="email" placeholder="john.doe@nhs.net" />
      </div>

      <div class="login-field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>

      <button class="login-btn" onclick="window.location.href='Dash.html'">Sign In</button>

      <div class="login-divider">
        <hr />
        <span>OR</span>
        <hr />
      </div>

      <a href="#" class="forgot-link">Forgot your password?</a>
    </div>

    <div class="login-footer">
      Royal United Hospitals Bath NHS Foundation Trust
    </div>

  </div>

</body>
</html>
