<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUH Team Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="dashpage.js" defer></script>
</head>
<body>

  <header class="header">
    <h1>RUH Team Overview</h1>
    <div class="header-logo">
      <img src="logo.png" alt="RUH Logo">
    </div>
  </header>

  <main class="content">

    <!-- PROFILE CARD -->
    <div class="profile-card">
      <div>
        <div class="avatar">
        </div>
        <div class="profile-name">Test Account</div>
      </div>

      <div class="badges">
        <div class="badge-group">
          <span class="badge not-started">Not Started</span>
          <span id="ns-count" class="badge-count">Tasks: 2</span>
        </div>
        <div class="badge-group">
          <span class="badge developing">Developing</span>
          <span id="d-count" class="badge-count">Tasks: 4</span>
        </div>
        <div class="badge-group">
          <span class="badge maturing">Maturing</span>
          <span id="m-count" class="badge-count">Tasks: 10</span>
        </div>
        <div class="badge-group">
          <span class="badge embedded">Embedded</span>
          <span id="e-count" class="badge-count">Tasks: 8</span>
        </div>
      </div>
    </div>

    <div class="assessment-card">
      <div class="powerbi-example">
        <iframe loading="lazy" src="https://app.powerbi.com/view?r=eyJrIjoiMTc4MTg4MWUtMzRlOS00ZmE3LTgwYmMtYjkxYWQxNWZhNzk4IiwidCI6IjlmODRlZTRiLWJlZTMtNDJmNy1iODRjLWU1N2U1ZTkyZjEwNSJ9&amp;autoplay=1&amp;volume=1" frameborder="0" scrolling="no" allow="autoplay" allowfullscreen="" class="iframe_embed">
					</iframe>
      </div>
    </div>

    <!-- ASSESSMENT CARD SECTION -->
    <div class="assessment-card">
      <h2>Maturity Assessment Overview</h2>

      <div>
        <div class="section-label">Not Started</div>
        <div class="bar-group">
          <div class="bar not-started"></div>
        </div>
      </div>

      <div>
        <div class="section-label">Developing</div>
        <div class="bar-group">
          <div class="bar developing"></div>
        </div>
      </div>

      <div>
        <div class="section-label">Maturing</div>
        <div class="bar-group">
          <div class="bar maturing"></div>
        </div>
      </div>

      <div>
        <div class="section-label">Embedded</div>
        <div class="bar-group">
          <div class="bar embedded"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <footer class="bottom-nav">
    <a href="Dash.html" class="nav-btn active">
      <img src="home-icon.png" alt="Home">
      <p>HOME</p>
    </a>

    <a href="recognition.html" class="nav-btn">
      <img src="recognition-icon.png" alt="Recognition">
      <p>RECOGNITION</p>
    </a>

    <a href="settings.html" class="nav-btn">
      <img src="settings-icon.png" alt="Settings">
      <p>SETTINGS</p>
    </a>
  </footer>

</body>
</html>
